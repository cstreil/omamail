name: Native credential contracts

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Native credentials (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Provision an isolated Secret Service fixture
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Shared plugin-backend validation and failure-classification tests
        shell: bash
        run: cargo test --locked --lib credentials
      - name: Native success, Missing, denial and bounded prompt gates (Linux)
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            fixture=$(mktemp -d)
            trap '\''rm -rf "$fixture"'\'' EXIT
            export XDG_DATA_HOME="$fixture/data"
            export XDG_RUNTIME_DIR="$fixture/runtime"
            mkdir -m 700 -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$fixture/control"
            printf "%s" "synthetic-native-gate-password" | gnome-keyring-daemon --unlock --components=secrets --control-directory="$fixture/control"
            cargo test --locked --lib credentials_native -- --ignored --test-threads=1
          '
